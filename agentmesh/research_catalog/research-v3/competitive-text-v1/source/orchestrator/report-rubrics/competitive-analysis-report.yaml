version: 1
id: competitive-analysis-report
dimensions:
  - id: requirement_coverage
    required: true
    criterion: Every requested market, competitor, and comparison scope is addressed.
  - id: question_coverage
    required: true
    criterion: Each required research question is answered by the comparison.
  - id: evidence_coverage
    required: true
    criterion: Samples, matrix values, differences, and screenshots are traceable to evidence.
  - id: reasoning_quality
    required: true
    criterion: Differences and impacts follow coherently from observed comparisons.
  - id: recommendation_quality
    required: true
    criterion: Actions are prioritized, specific, and rooted in identified differences.
  - id: visual_quality
    required: true
    criterion: Each visualEvidence single image is legible, relevant, and bound to matching screenshot Evidence plus same-URL public_source Evidence. Every screenshot comparison contains exactly two unique Asset ids in original-to-annotation order with exact lineage and visibly states that the whole-image input-provenance boundary does not locate or substantiate a research finding. Without a displayable visual, empty visualEvidence and screenshotComparisons arrays are valid and no Asset id is invented.
  - id: risk_disclosure
    required: true
    criterion: Sampling limits, evidence gaps, and uncertainty are explicit.
