[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Chat-first team agent platform prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2.13,<3",
  "httpx",
  "jsonschema>=4,<5",
  "keyring>=25,<26",
  "markdown-it-py>=3,<4",
  "openai-agents==0.21.1",
  "platformdirs>=4,<5",
  "pymupdf",
  "python-multipart",
  "PyYAML>=6,<7",
  "croniter>=6,<7",
  "psutil>=7.2,<8",
]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
]
prd = [
  "Pillow>=10,<12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "2C-DesignWiki",
  "wiki",
  "agentmesh/builtin_skills",
  "docs/verification/ai-x-parity-evidence",
  "tests/fixtures/ai_x_history",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentmesh"]

[tool.setuptools.packages.find]
include = ["agentmesh*"]

[tool.setuptools.package-data]
agentmesh = [
  "builtin_skills/**",
  "skill_runtime/policies/*.json",
  "task_catalog/**",
]
