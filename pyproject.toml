[project]
name = "agentmesh"
version = "0.1.0"
description = "Chat-first team agent platform prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "httpx",
  "jsonschema>=4,<5",
  "openai-agents==0.21.1",
  "pymupdf",
  "python-multipart",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
]
prd = [
  "Pillow>=10,<12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "2C-DesignWiki",
  "agentmesh/builtin_skills",
  "docs/verification/ai-x-parity-evidence",
  "tests/fixtures/ai_x_history",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentmesh"]

[tool.setuptools.packages.find]
include = ["agentmesh*"]

[tool.setuptools.package-data]
agentmesh = [
  "builtin_skills/**",
  "schemas/research/*.json",
  "research_catalog/research-v3/competitive-text-v1/**",
  "task_catalog/user-research-v1/**",
]
