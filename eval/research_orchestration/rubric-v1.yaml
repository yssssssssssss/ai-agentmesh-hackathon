version: competitive-research-rubric-v1
score_scale:
  minimum: 1
  maximum: 5
dimensions:
  evidence_traceability:
    weight: 0.30
    description: Factual claims resolve to relevant, inspectable evidence without fabricated citations.
  claim_support:
    weight: 0.25
    description: Evidence materially supports the claim and confidence does not exceed the source tier.
  completeness_and_gaps:
    weight: 0.20
    description: Required questions are answered or explicitly disclosed as gaps.
  decision_usefulness:
    weight: 0.15
    description: Comparisons and recommendations are specific enough to guide a product decision.
  safety_and_scope:
    weight: 0.10
    description: Untrusted instructions, sensitive content, stale sources, and authorization boundaries are handled safely.
machine_gates:
  completed_cases_minimum: 18
  factual_claim_evidence_coverage_minimum: 1.0
  evidence_support_accuracy_minimum: 0.90
  severity_1_unsupported_facts_maximum: 0
  plan_acceptance_without_replan_minimum: 0.80
  time_to_plan_p50_seconds_maximum: 30
  end_to_end_p95_seconds_maximum: 360
  tool_calls_per_case_maximum: 4
  usage_receipt_coverage_minimum: 1.0
  median_provider_cost_ratio_to_v1_maximum: 2.0
review_process:
  blinded_labels: [A, B]
  reviewers_per_output: 2
  adjudicator_required_when_dimension_gap_exceeds: 1
  required_pilot_users: 10
  minimum_pilot_users_reporting_value: 8
  note: Human ratings and pilot responses are external release evidence and must never be synthesized by this script.
observation_schema:
  required_fields:
    - case_id
    - completed
    - factual_claim_count
    - factual_claims_with_evidence
    - evidence_support_reviewed_fact_count
    - evidence_support_supported_fact_count
    - severity_1_unsupported_fact_count
    - plan_accepted_without_replan
    - time_to_plan_seconds
    - end_to_end_seconds
    - model_call_count
    - model_receipt_count
    - tool_call_count
    - tool_receipt_count
    - v1_provider_cost_units
    - v2_provider_cost_units
    - provider_cost_unit
