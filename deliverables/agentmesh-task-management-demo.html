<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>AgentMesh 项目任务管理 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas:#0b0d10;--base:#0f1216;--s1:#15191e;--s2:#1a1f25;--s3:#222830;--s4:#2b323b;

    }
    *{box-sizing:border-box}html{min-width:320px;background:var(--canvas);-webkit-font-smoothing:antialiased}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--text);font:14px/1.5 var(--font)}
    button,input,select,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}button:active{transform:scale(.98)}[hidden]{display:none!important}
    ::selection{background:rgba(84,230,187,.25)}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:999px;background:rgba(255,255,255,.12);background-clip:padding-box}

    .skip{position:fixed;z-index:100;top:8px;left:8px;transform:translateY(-160%);border-radius:8px;background:var(--mint);color:#08231b;padding:8px 12px;font-weight:750}.skip:focus{transform:none}

    .app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--base);animation:enter-left .4s cubic-bezier(.22,1,.36,1) both}
    .brand{height:70px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 17px}.brandmark{position:relative;width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:10px;background:var(--mint);color:#08231b;font:850 11px var(--mono)}.brandmark:after{content:"";position:absolute;inset:7px;border:1px solid rgba(8,35,27,.35);border-radius:50%}.brand strong,.brand span{display:block}.brand strong{font-size:15px}.brand span{margin-top:1px;color:var(--text3);font-size:9px;letter-spacing:.08em}
    .navscroll{flex:1;overflow:auto;padding:15px 10px}.navgroup+.navgroup{margin-top:22px}.navlabel{padding:0 9px 7px;color:#5e6966;font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.navitem{position:relative;width:100%;min-height:41px;display:grid;grid-template-columns:21px minmax(0,1fr) auto;align-items:center;gap:9px;border:0;border-radius:9px;background:transparent;padding:8px 9px;color:#87918f;text-align:left;cursor:pointer;transition:background-color 130ms,color 130ms}.navitem:hover{background:rgba(255,255,255,.035);color:var(--text2)}.navitem.active{background:var(--s3);color:var(--text)}.navitem.active:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--mint)}.navitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:650}.navcount{min-width:21px;border-radius:999px;background:rgba(255,255,255,.055);padding:1px 6px;color:var(--text3);text-align:center;font:700 8px var(--mono)}
    .projectlink{width:100%;border:0;border-radius:9px;background:transparent;padding:8px 9px;text-align:left;cursor:pointer}.projectlink:hover{background:rgba(255,255,255,.035)}.projectlink strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);font-size:10px}.projectlink span{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--text3);font-size:8px}.pdot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
    .sidebarfoot{border-top:1px solid var(--line);padding:13px}.user{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:var(--mintbg);color:var(--mint);font-size:9px;font-weight:800}.user strong,.user span{display:block}.user strong{font-size:10px}.user span{margin-top:2px;color:var(--text3);font-size:8px}

    .workspace{min-width:0}.topbar{position:sticky;z-index:20;top:0;height:58px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:rgba(11,13,16,.90);padding:0 24px;backdrop-filter:blur(18px)}
    .projectselect{display:flex;align-items:center;gap:9px;min-width:0;border:0;background:transparent;padding:6px;color:var(--text2);cursor:pointer}.projectselect span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:650}.projectselect small{border-radius:999px;background:var(--amberbg);padding:2px 6px;color:var(--amber);font-size:8px}.topactions{display:flex;align-items:center;gap:7px}.prototype{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--s1);padding:5px 8px;color:var(--text3);font-size:8px}.prototype:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber)}
    .iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--s1);color:var(--text3);cursor:pointer}.iconbtn:hover{border-color:var(--line2);color:var(--text2)}

    .healthstrip{display:grid;grid-template-columns:1.35fr repeat(5,1fr);margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.health{min-width:0;padding:14px 16px}.health:first-child{padding-left:0}.health+.health{border-left:1px solid var(--line)}.health span,.health strong,.health small{display:block}.health span{color:var(--text3);font-size:8px;letter-spacing:.04em}.health strong{margin-top:4px;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.health:first-child strong{font-size:19px}.health small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;color:var(--text3);font-size:8px}.health .risk{color:var(--red)}.health .agent{color:var(--mint)}
    .meter{height:3px;overflow:hidden;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.06)}.meter i{display:block;height:100%;border-radius:inherit;background:var(--mint);transform-origin:left;animation:grow .65s cubic-bezier(.22,1,.36,1) both}

    .controlbar{position:sticky;z-index:15;top:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:23px -4px 0;border-bottom:1px solid var(--line);background:rgba(11,13,16,.94);padding:9px 4px 11px;backdrop-filter:blur(16px)}.viewtabs,.filters{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:none}.viewtabs::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.viewtab,.filter{min-height:33px;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;border:0;border-radius:8px;background:transparent;padding:6px 9px;color:var(--text3);font-size:9px;font-weight:680;cursor:pointer}.viewtab:hover,.filter:hover{background:rgba(255,255,255,.035);color:var(--text2)}.viewtab.active,.filter.active{background:var(--s3);color:var(--text)}.viewtab .icon{width:14px;height:14px}.filter b{min-width:17px;border-radius:999px;background:rgba(255,255,255,.055);padding:1px 5px;font:700 8px var(--mono)}.controlright{display:flex;align-items:center;gap:7px}.search{position:relative;width:min(230px,25vw)}.search .icon{position:absolute;left:10px;top:9px;width:14px;color:var(--text3);pointer-events:none}.search input{width:100%;height:33px;border:1px solid var(--line);border-radius:9px;background:var(--s1);padding:0 31px;color:var(--text);font-size:9px}.search input::placeholder{color:#596360}.filterbtn{min-height:33px;white-space:nowrap}
    .subfilters{display:flex;align-items:center;gap:5px;margin-top:13px;overflow-x:auto;scrollbar-width:none}.subfilters::-webkit-scrollbar{display:none}.chip{min-height:29px;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:transparent;padding:5px 9px;color:var(--text3);font-size:8px;cursor:pointer}.chip.active{border-color:rgba(84,230,187,.3);background:var(--mintbg);color:var(--mint)}
    #viewRoot{margin-top:16px;animation:view-in .24s cubic-bezier(.22,1,.36,1) both}

    /* Board */
    .boardwrap{overflow-x:auto;padding-bottom:12px}.board{min-width:1050px;display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px}.column{min-width:0;border-top:1px solid var(--line)}.colhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 10px}.coltitle{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:10px;font-weight:750}.coldot{width:7px;height:7px;border-radius:50%;background:#5f6b68}.coldot.todo{background:var(--blue)}.coldot.progress{background:var(--mint)}.coldot.review{background:var(--amber)}.coldot.done{background:#6c7774}.colmeta{color:var(--text3);font:8px var(--mono)}.colbody{min-height:430px;display:grid;align-content:start;gap:8px;border-radius:10px;background:rgba(255,255,255,.018);padding:7px}
    .taskcard{position:relative;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--s1);padding:12px;text-align:left;cursor:pointer;transition:transform 150ms,border-color 150ms,background-color 150ms;animation:card-in .28s cubic-bezier(.22,1,.36,1) both}.taskcard:hover{transform:translateY(-2px);border-color:var(--line2);background:var(--s2)}.taskcard.blocked{box-shadow:inset 2px 0 var(--red)}.tasktop,.taskfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.taskkey{color:var(--text3);font:700 8px var(--mono)}.priority{border-radius:999px;background:rgba(255,255,255,.055);padding:2px 6px;color:var(--text3);font:750 7px var(--mono)}.priority.p0{background:var(--redbg);color:var(--red)}.priority.p1{background:var(--amberbg);color:var(--amber)}.taskcard h3{margin:9px 0 0;font-size:11px;line-height:1.45}.tasktags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.tag{border-radius:999px;background:rgba(255,255,255,.045);padding:2px 6px;color:var(--text3);font-size:7px}.tag.agenttag{background:var(--mintbg);color:var(--mint)}.taskprogress{height:2px;overflow:hidden;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.06)}.taskprogress i{display:block;height:100%;border-radius:inherit;background:var(--mint)}.taskfoot{margin-top:10px}.assignee{display:flex;align-items:center;gap:6px;min-width:0}.face{position:relative;width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:var(--s4);color:var(--text2);font-size:7px;font-weight:800}.face.agentface{border:1px solid rgba(84,230,187,.3);background:var(--mintbg);color:var(--mint)}.face.agentface:after{content:"";position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;border:2px solid var(--s1);border-radius:50%;background:var(--mint)}.assignee span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3);font-size:8px}.due{color:var(--text3);font:7px var(--mono);white-space:nowrap}.due.late{color:var(--red)}

    .taskprogress{display:block}

    /* List */
    .listtable{width:100%;border-collapse:collapse;table-layout:fixed}.listtable th{border-bottom:1px solid var(--line);padding:9px 8px;color:var(--text3);text-align:left;font-size:8px;font-weight:700}.listtable td{border-bottom:1px solid var(--line);padding:10px 8px;color:var(--text2);font-size:9px;vertical-align:middle}.listtable tr[data-task]{cursor:pointer;transition:background-color 130ms}.listtable tr[data-task]:hover{background:rgba(255,255,255,.025)}.list-title{display:flex;align-items:center;gap:8px;min-width:0}.list-title strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:rgba(255,255,255,.05);padding:3px 7px;color:var(--text3);font-size:8px}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.status.in_progress{background:var(--mintbg);color:var(--mint)}.status.review{background:var(--amberbg);color:var(--amber)}.status.todo{background:var(--bluebg);color:var(--blue)}.status.blocked{background:var(--redbg);color:var(--red)}.miniassignee{display:flex;align-items:center;gap:6px;min-width:0}.miniassignee .face{width:22px;height:22px}.miniassignee span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Calendar */

    /* Agents */
    .agentoverview{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}.agentmetric{padding:13px 16px}.agentmetric:first-child{padding-left:0}.agentmetric+.agentmetric{border-left:1px solid var(--line)}.agentmetric span,.agentmetric strong,.agentmetric small{display:block}.agentmetric span{color:var(--text3);font-size:8px}.agentmetric strong{margin-top:4px;font-size:17px}.agentmetric small{margin-top:2px;color:var(--text3);font-size:7px}.agentshell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.agentlist{border-right:1px solid var(--line);padding-right:14px}.agentlisthead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 9px;color:var(--text3);font-size:8px}.agentrow{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;border:0;border-radius:10px;background:transparent;padding:10px 8px;text-align:left;cursor:pointer}.agentrow:hover{background:rgba(255,255,255,.03)}.agentrow.active{background:var(--s2)}.agenticon{position:relative;width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(84,230,187,.22);border-radius:10px;background:var(--mintbg);color:var(--mint);font:800 9px var(--mono)}.agenticon:after{content:"";position:absolute;right:-2px;bottom:-2px;width:7px;height:7px;border:2px solid var(--base);border-radius:50%;background:var(--mint)}.agenticon.paused:after{background:var(--text3)}.agenticon.attention:after{background:var(--red)}.agentcopy{min-width:0}.agentcopy strong,.agentcopy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agentcopy strong{font-size:10px}.agentcopy span{margin-top:3px;color:var(--text3);font-size:8px}.queuecount{color:var(--text3);font:8px var(--mono)}
    .agentdetail{min-width:0;animation:detail-in .25s cubic-bezier(.22,1,.36,1) both}.agenthero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:17px}.agentidentity{display:flex;gap:12px}.agentidentity .agenticon{width:44px;height:44px;font-size:11px}.agentidentity h2{margin:1px 0 0;font-size:17px}.agentidentity p{margin:5px 0 0;color:var(--text3);font-size:9px}.agentbadges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.abadge{border-radius:999px;background:rgba(255,255,255,.05);padding:3px 7px;color:var(--text3);font-size:7px}.abadge.live{background:var(--mintbg);color:var(--mint)}.agentstats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:17px;border-bottom:1px solid var(--line);padding-bottom:16px}.agentstat+.agentstat{border-left:1px solid var(--line);padding-left:14px}.agentstat span,.agentstat strong,.agentstat small{display:block}.agentstat span{color:var(--text3);font-size:7px}.agentstat strong{margin-top:4px;font-size:14px}.agentstat small{margin-top:2px;color:var(--text3);font-size:7px}.agentgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}.agentsection{border-top:1px solid var(--line);padding-top:13px}.agentsection h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:var(--text2);font-size:9px}.currenttask{border:1px solid var(--line);border-left:2px solid var(--mint);border-radius:9px;background:var(--s1);padding:11px}.currenttask strong{display:block;font-size:10px}.currenttask span{display:block;margin-top:4px;color:var(--text3);font-size:8px}.queueitem{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;text-align:left;cursor:pointer}.queueitem:hover{background:rgba(255,255,255,.025)}.queueitem strong,.queueitem span{display:block}.queueitem strong{font-size:9px}.queueitem span{margin-t 并通知</strong></div></section></aside></div></section></div>`}
    function renderOverview(){return `<div class="agentoverview"><div class="agentmetric"><span>下一个里程碑</span><strong>设计评审</strong><small>8 月 22 日 · 还有 3 天</small></div><div class="agentmetric"><span>任务完成</span><strong>${tasks.filter(t=>t.status==='done').length} / ${tasks.length}</strong><small>按项目任务计算</small></div><div class="agentmetric"><span>人类在制品</span><strong>${tasks.filter(t=>assignee(t.assignee).type==='human'&&t.status==='in_progress').length}</strong><small>当前 WIP</small></div><div class="agentmetric"><span>Agent 在制品</span><strong>${tasks.filter(t=>assignee(t.assignee).type==='agent'&&t.status==='in_progress').length}</strong><small>可自动推进</small></div></div><div class="agentshell"><section><div class="agentsection"><h3>影响里程碑的任务</h3>${tasks.filter(t=>t.priority==='P0'||t.blocked).map(t=>`<button class="queueitem" data-task="${t.id}"><span><strong>${esc(t.title)}</strong><span>${t.id} · ${esc(assignee(t.assignee).name)}</span></span><b>${dueLabel(t.due)}</b></button>`).join('')}</div></section><aside><div class="agentsection"><h3>项目健康</h3><div class="policyrow"><span>范围</span><strong>稳定</strong></div><div class="policyrow"><span>进度</span><strong style="color:var(--amber)">有风险</strong></div><div class="policyrow"><span>资源</span><strong>可控</strong></div><div class="policyrow"><span>证据</span><strong>1 个缺口</strong></div></div></aside></div>`}

    function setPage(view){state.view=view;const taskView=['board','list','calendar'].includes(view);$('#pageTitle').textContent=view==='agents'?'Agent 中心':view==='overview'?'项目总览':'任务管理';$('#pageCopy').textContent=view==='agents'?'管理 Agent 运行状态、任务负载、能力、工具授权与自治策略。':view==='overview'?'查看项目目标、里程碑、风险以及人与 Agent 的整体执行情况。':'统一管理人的工作与 Agent 执行任务，项目状态、依赖、证据和权限保持可追溯。';$('#subfilters').hidden=!taskView;$('.controlright').hidden=!taskView;$('.healthstrip').hidden=view==='agents';$$('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view||(view==='list'&&el.dataset.view==='board'&&el.classList.contains('navitem'))));$$('.viewtab').forEach(el=>el.classList.toggle('active',el.dataset.view===view));$$('.mobilenav button').forEach(el=>el.classList.toggle('active',el.dataset.view===view||(view==='list'&&el.dataset.view==='board')));renderView()}
    function renderView(){const root=$('#viewRoot');root.style.animation='none';void root.offsetWidth;root.style.animation='';root.innerHTML=state.view==='board'?renderBoard():state.view==='list'?renderList():state.view==='calendar'?renderCalendar():state.view==='agents'?renderAgents():renderOverview();updateMetrics()}

    function openTask(id){state.selectedTask=id;renderDrawer();document.body.classList.add('drawer-open')}
    function renderDrawer(){const t=tasks.find(x=>x.id===state.selectedTask);if(!t)return;const p=assignee(t.assignee),next=statusOrder[Math.min(statusOrder.indexOf(t.status)+1,statusOrder.length-1)];$('#drawerKey').textContent=t.id;$('#drawerBody').innerHTML=`<div class="drawertags"><span class="priority ${t.priority.toLowerCase()}">${t.priority}</span><span class="status ${t.blocked?'blocked':t.status}">${t.blocked?'阻塞':statusMeta[t.status].label}</span><span class="tag">${esc(t.type)}</span>${p.type==='agent'?'<span class="tag agenttag">Agent 执行</span>':''}</div><h2>${esc(t.title)}</h2><p class="drawersummary">${esc(t.description)}</p><section class="drawersection"><div class="formgrid"><div class="field"><label>阶段</label><select id="editStatus">${statusOrder.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${statusMeta[s].label}</option>`).join('')}</select></div><div class="field"><label>负责人</label><select id="editAssignee">${Object.values(people).map(x=>`<option value="${x.id}" ${x.id===t.assignee?'selected':''}>${x.type==='agent'?'Agent · ':''}${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>截止日期</label><input id="editDue" type="date" value="${t.due}" /></div><div class="field"><label>优先级</label><select id="editPriority">${['P0','P1','P2','P3'].map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></div></div></section><section class="drawersection"><h3>任务进度</h3><div class="progressline"><div class="meter"><i style="width:${t.progress}%"></i></div><strong>${t.progress}%</strong></div></section><section class="drawersection"><h3>子任务 · ${t.subtasks.filter(x=>x[1]).length}/${t.subtasks.length}</h3><div class="checklist">${t.subtasks.map((x,i)=>`<label class="checkitem"><input type="checkbox" data-subtask="${i}" ${x[1]?'checked':''}/><span>${esc(x[0])}</span></label>`).join('')}</div></section><section class="drawersection"><h3>依赖关系 · ${t.dependencies.length}</h3>${t.dependencies.map(x=>`<div class="dependency"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')||'<div class="calempty">没有前置依赖</div>'}</section><section class="drawersection"><h3>活动与审计</h3><ol class="activity">${t.activity.map(x=>`<li><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></li>`).join('')}</ol></section><div class="draweractions"><button class="button" data-save-task>保存修改</button>${t.status!=='done'?`<button class="button primary" data-advance-task="${next}">推进到${statusMeta[next].label}</button>`:'<button class="button primary" data-demo="查看交付物">查看交付物</button>'}</div>`}
    function saveDrawer(advance){const t=tasks.find(x=>x.id===state.selectedTask);if(!t)return;t.status=advance||$('#editStatus').value;t.assignee=$('#editAssignee').value;t.due=$('#editDue').value;t.priority=$('#editPriority').value;t.subtasks=t.subtasks.map((x,i)=>[x[0],Boolean($(`[data-subtask="${i}"]`)?.checked)]);t.progress=t.status==='done'?100:Math.max(t.progress,Math.round(t.subtasks.filter(x=>x[1]).length/Math.max(1,t.subtasks.length)*100));t.activity.unshift([advance?`任务推进到${statusMeta[t.status].label}`:'任务字段已更新','刚刚 · 何云深']);showToast(advance?`已将 ${t.id} 推进到「${statusMeta[t.status].label}」`:`已保存 ${t.id}`);renderDrawer();renderView()}

    function openModal(){const modal=$('#createModal');modal.classList.add('open');setTimeout(()=>$('#newTitle').focus(),80)}function closeModal(){$('#createModal').classList.remove('open');$('#createForm').reset();$('#newDue').value='2026-08-21'}
    function showToast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}

    document.addEventListener('click',event=>{const task=event.target.closest('[data-task]');if(task){openTask(task.dataset.task);return}const view=event.target.closest('[data-view]');if(view){setPage(view.dataset.view);return}const filter=event.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===filter));renderView();return}const agent=event.target.closest('[data-agent]');if(agent){state.selectedAgent=agent.dataset.agent;renderView();return}const toggle=event.target.closest('[data-toggle-agent]');if(toggle){const a=agents.find(x=>x.id===toggle.dataset.toggleAgent);if(a){a.status=a.status==='paused'?'online':'paused';a.statusLabel=a.status==='paused'?'已暂停':'在线';showToast(`${a.name}${a.status==='paused'?'已暂停，不再接收新任务':'已恢复运行'}`);renderView()}return}if(event.target.closest('[data-open-create]')){openModal();return}if(event.target.closest('[data-close-modal]')||event.target=== $('#createModal')){closeModal();return}if(event.target.closest('[data-close-drawer]')){document.body.classList.remove('drawer-open');return}if(event.target.closest('[data-save-task]')){saveDrawer();return}const advance=event.target.closest('[data-advance-task]');if(advance){saveDrawer(advance.dataset.advanceTask);return}const capability=event.target.closest('[data-capability]');if(capability){capability.classList.toggle('on');showToast(`${capability.textContent.trim()} ${capability.classList.contains('on')?'已启用':'已停用'}`);return}const demo=event.target.closest('[data-demo]');if(demo)showToast(`原型动作：${demo.dataset.demo}`)});
    $('#search').addEventListener('input',event=>{state.query=event.target.value;renderView()});
    $('#createForm').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget),number=500+tasks.length+1,task={id:`TASK-${number}`,title:String(data.get('title')).trim(),type:String(data.get('type')),status:String(data.get('status')),priority:String(data.get('priority')),due:String(data.get('due')),assignee:String(data.get('assignee')),progress:0,blocked:false,tags:[String(data.get('type')),String(data.get('estimate'))],description:String(data.get('description')).trim()||'尚未补充任务说明。',subtasks:[['明确完成条件',false]],dependencies:[],activity:[['任务已创建','刚刚 · 何云深']]};tasks.unshift(task);closeModal();state.view='board';state.filter='all';setPage('board');showToast(`${task.id} 已创建并指派给 ${assignee(task.assignee).name}`);setTimeout(()=>openTask(task.id),180)});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('#createModal').classList.contains('open'))closeModal();else document.body.classList.remove('drawer-open')}if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){event.preventDefault();$('#search').focus()}});
    updateMetrics();renderView();
  </script>
</body>
</html>
