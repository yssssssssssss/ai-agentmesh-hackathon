<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AgentMesh 产品级任务管理整合 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0c0e11;
      --base: #0f1216;
      --surface-1: #14181d;
      --surface-2: #191e24;
      --surface-3: #20262d;
      --surface-4: #283039;
      --text-1: #f1f5f3;
      --text-2: #c7d0cd;
      --text-3: #8e9995;
      --text-4: #5e6865;
      --line: rgba(255,255,255,.07);
      --line-strong: rgba(255,255,255,.14);
      --mint: #54e6bb;
      --mint-2: #2dd4a8;
      --mint-soft: rgba(84,230,187,.09);
      --amber: #f3be67;
      --amber-soft: rgba(243,190,103,.10);
      --red: #ff7e8b;
      --red-soft: rgba(255,126,139,.10);
      --blue: #83aef8;
      --blue-soft: rgba(131,174,248,.10);
      --sidebar: 236px;
      --topbar: 58px;
      --radius: 11px;
      --shadow: 0 24px 70px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text-2);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      font-feature-settings: "tnum" 1, "lnum" 1;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(84,230,187,.55);
      outline-offset: 2px;
    }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); background-clip: padding-box; }
    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0,1fr);
      height: 100vh;
      height: 100svh;
    }
    .global-sidebar {
      z-index: 50;
      display: flex;
      min-width: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--base);
    }
    .brand {
      display: flex;
      height: 80px;
      align-items: center;
      gap: 11px;
      padding: 0 18px;
    }
    .brand-mark {
      position: relative;
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(84,230,187,.20);
      border-radius: 10px;
      background: var(--mint-soft);
      color: var(--mint);
    }
    .brand-mark:before, .brand-mark:after {
      position: absolute;
      content: "";
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: .72;
    }
    .brand-mark:before { width: 16px; height: 9px; transform: rotate(28deg); }
    .brand-mark:after { width: 9px; height: 16px; transform: rotate(-28deg); }
    .brand-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; color: var(--text-1); font-size: 18px; letter-spacing: -.02em; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--text-4); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .global-nav {
      flex: 1;
      overflow-y: auto;
      padding: 6px 11px 16px;
    }
    .nav-label {
      padding: 14px 10px 7px;
      color: var(--text-4);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .global-link {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      padding: 0 11px;
      color: var(--text-3);
      text-align: left;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, transform .16s ease;
    }
    .global-link:hover { background: rgba(255,255,255,.035); color: var(--text-2); }
    .global-link:active { transform: scale(.985); }
    .global-link.active { background: var(--surface-3); color: var(--text-1); }
    .global-link.active:before {
      position: absolute;
      left: 0;
      top: 11px;
      bottom: 11px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--mint);
      content: "";
    }
    .global-link.active .icon { color: var(--mint); }
    .global-link .link-label { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
    .nav-badge {
      display: inline-flex;
      min-width: 20px;
      height: 19px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      padding: 0 6px;
      color: var(--text-3);
      font-size: 10px;
      font-weight: 700;
    }
    .nav-badge.new { background: var(--mint-soft); color: var(--mint); font-size: 9px; letter-spacing: .03em; }
    .sidebar-footer { border-top: 1px solid var(--line); padding: 12px; }
    .employee-link {
      display: grid;
      width: 100%;
      grid-template-columns: 36px minmax(0,1fr) 16px;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-1);
      padding: 10px;
      color: var(--text-2);
      text-align: left;
      cursor: pointer;
      transition: border-color .16s, background .16s;
    }
    .employee-link:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .employee-orb, .face, .agent-icon {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-weight: 750;
    }
    .employee-orb {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(84,230,187,.22);
      border-radius: 11px;
      background: var(--mint-soft);
      color: var(--mint);
      font-size: 10px;
    }
    .employee-orb:after, .agent-icon:after {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 7px;
      height: 7px;
      border: 2px solid var(--base);
      border-radius: 50%;
      background: var(--mint);
      content: "";
    }
    .employee-copy { min-width: 0; }
    .employee-copy strong, .employee-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .employee-copy strong { color: var(--text-1); font-size: 12px; }
    .employee-copy span { margin-top: 3px; color: var(--text-4); font-size: 10px; }
    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 9px;
      padding: 4px 7px;
    }
    .profile .face { width: 29px; height: 29px; border-radius: 50%; background: #29423c; color: #9bf0d6; font-size: 10px; }
    .profile-copy { min-width: 0; flex: 1; }
    .profile-copy strong, .profile-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-copy strong { color: var(--text-2); font-size: 11px; }
    .profile-copy span { margin-top: 2px; color: var(--text-4); font-size: 9px; }

    .product-shell { display: flex; min-width: 0; flex-direction: column; overflow: hidden; }
    .topbar, .mobile-header {
      z-index: 30;
      display: flex;
      height: var(--topbar);
      flex: 0 0 auto;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: rgba(12,14,17,.88);
      backdrop-filter: blur(18px);
    }
    .topbar { justify-content: space-between; padding: 0 22px; }
    .topbar-left, .topbar-right, .breadcrumb, .project-switcher, .presence, .header-actions { display: flex; align-items: center; }
    .topbar-left { min-width: 0; gap: 14px; }
    .breadcrumb { min-width: 0; gap: 7px; color: var(--text-4); font-size: 11px; }
    .breadcrumb strong { overflow: hidden; color: var(--text-2); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .breadcrumb .slash { color: #3d4643; }
    .project-switcher {
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-1);
      padding: 6px 9px;
      color: var(--text-2);
      cursor: pointer;
    }
    .project-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--mint); box-shadow: 0 0 10px rgba(84,230,187,.35); }
    .topbar-right { gap: 12px; }
    .presence { gap: 7px; color: var(--text-3); font-size: 10px; }
    .presence-stack { display: flex; padding-left: 7px; }
    .presence-stack .face { width: 24px; height: 24px; margin-left: -7px; border: 2px solid var(--canvas); border-radius: 50%; background: var(--surface-4); color: var(--text-2); font-size: 8px; }
    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background .15s, color .15s, transform .15s;
    }
    .icon-button:hover { background: rgba(255,255,255,.05); color: var(--text-1); }
    .icon-button:active { transform: scale(.94); }
    .mobile-header { display: none; justify-content: space-between; padding: 0 14px; }
    .mobile-title { display: flex; align-items: center; gap: 9px; color: var(--text-1); font-weight: 650; }
    .mobile-title .brand-mark { width: 30px; height: 30px; border-radius: 9px; }
    .scrim { display: none; }

    .main-root { min-width: 0; flex: 1; overflow: hidden; }
    .page {
      display: flex;
      height: 100%;
      min-width: 0;
      flex-direction: column;
      animation: page-in .24s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes page-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .module-head {
      flex: 0 0 auto;
      padding: 22px 26px 0;
      background: linear-gradient(180deg, rgba(255,255,255,.012), transparent);
    }
    .module-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .eyebrow { color: var(--mint); font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .module-head h1 { margin: 7px 0 0; color: var(--text-1); font-size: clamp(20px,2vw,27px); line-height: 1.12; letter-spacing: -.035em; }
    .module-head p { max-width: 720px; margin: 8px 0 0; color: var(--text-3); font-size: 11px; line-height: 1.6; }
    .header-actions { gap: 8px; }
    .button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-1);
      padding: 0 12px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
    }
    .button:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--text-1); }
    .button:active { transform: scale(.975); }
    .button.primary { border-color: transparent; background: var(--mint); color: #06231b; }
    .button.primary:hover { background: #6aefc7; color: #031b15; }
    .button.ghost { border-color: transparent; background: transparent; color: var(--text-3); }
    .button.danger { border-color: rgba(255,126,139,.20); background: var(--red-soft); color: var(--red); }
    .button .icon { width: 15px; height: 15px; }

    .task-tabs {
      display: flex;
      gap: 3px;
      overflow-x: auto;
      margin-top: 18px;
      border-bottom: 1px solid var(--line);
    }
    .task-tab {
      position: relative;
      display: inline-flex;
      min-height: 39px;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
      padding: 0 12px;
      color: var(--text-3);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .task-tab:hover { color: var(--text-1); }
    .task-tab.active { color: var(--text-1); }
    .task-tab.active:after {
      position: absolute;
      right: 9px;
      bottom: -1px;
      left: 9px;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--mint);
      content: "";
    }
    .task-tab.active .icon { color: var(--mint); }
    .task-tab .icon { width: 15px; height: 15px; }
    .tab-count { border-radius: 999px; background: rgba(255,255,255,.055); padding: 1px 6px; color: var(--text-4); font-size: 9px; }

    .metric-strip {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: 1.25fr repeat(5,minmax(104px,1fr));
      margin: 0 26px;
      border-bottom: 1px solid var(--line);
    }
    .metric { min-width: 0; padding: 13px 15px; }
    .metric:first-child { padding-left: 0; }
    .metric + .metric { border-left: 1px solid var(--line); }
    .metric span, .metric strong, .metric small { display: block; }
    .metric span { overflow: hidden; color: var(--text-4); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .metric strong { margin-top: 4px; color: var(--text-1); font-size: 17px; letter-spacing: -.025em; }
    .metric:first-child strong { font-size: 19px; }
    .metric small { overflow: hidden; margin-top: 3px; color: var(--text-4); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .metric strong.mint { color: var(--mint); }
    .metric strong.red { color: var(--red); }
    .metric strong.amber { color: var(--amber); }

    .control-bar {
      z-index: 10;
      display: flex;
      min-height: 53px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(12,14,17,.90);
      padding: 8px 26px;
      backdrop-filter: blur(16px);
    }
    .filter-set, .control-tools { display: flex; min-width: 0; align-items: center; gap: 6px; }
    .filter-set { overflow-x: auto; }
    .chip {
      min-height: 30px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      background: transparent;
      padding: 0 10px;
      color: var(--text-3);
      font-size: 10px;
      cursor: pointer;
    }
    .chip:hover { background: rgba(255,255,255,.035); color: var(--text-2); }
    .chip.active { background: var(--surface-3); color: var(--text-1); }
    .search {
      position: relative;
      width: 215px;
      flex: 0 0 auto;
    }
    .search .icon { position: absolute; left: 10px; top: 8px; width: 14px; height: 14px; color: var(--text-4); pointer-events: none; }
    .search input {
      width: 100%;
      height: 31px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-1);
      padding: 0 30px;
      color: var(--text-2);
      font-size: 10px;
    }
    .search input::placeholder { color: var(--text-4); }
    .shortcut { position: absolute; right: 8px; top: 8px; color: var(--text-4); font: 8px "SFMono-Regular", monospace; }

    .view-root { min-width: 0; flex: 1; overflow: auto; padding: 18px 26px 26px; }
    .board-wrap { min-height: 100%; overflow-x: auto; }
    .board { display: grid; min-width: 1120px; grid-template-columns: repeat(5,minmax(205px,1fr)); gap: 10px; }
    .column { min-width: 0; border-right: 1px solid var(--line); padding-right: 10px; }
    .column:last-child { border-right: 0; padding-right: 0; }
    .column-head { display: flex; height: 32px; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 8px; }
    .column-title { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 10px; font-weight: 700; }
    .column-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-4); }
    .column-dot.todo { background: var(--blue); }
    .column-dot.progress { background: var(--mint); box-shadow: 0 0 10px rgba(84,230,187,.45); }
    .column-dot.review { background: var(--amber); }
    .column-dot.done { background: #6e7a76; }
    .column-meta { color: var(--text-4); font: 9px "SFMono-Regular", monospace; }
    .column-body { display: grid; align-content: start; gap: 8px; }
    .task-card {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-1);
      padding: 12px;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      animation: card-in .3s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .task-card:hover { transform: translateY(-2px); border-color: var(--line-strong); background: var(--surface-2); }
    .task-card.blocked { box-shadow: inset 2px 0 var(--red); }
    .task-top, .task-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-key { color: var(--text-4); font: 700 8px "SFMono-Regular", monospace; letter-spacing: .015em; }
    .priority, .status, .tag, .agent-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      white-space: nowrap;
      font-style: normal;
      font-weight: 650;
    }
    .priority { background: rgba(255,255,255,.05); padding: 2px 6px; color: var(--text-4); font-size: 8px; }
    .priority.p0 { background: var(--red-soft); color: var(--red); }
    .priority.p1 { background: var(--amber-soft); color: var(--amber); }
    .task-card h3 { margin: 9px 0 0; color: var(--text-1); font-size: 11px; line-height: 1.5; font-weight: 620; }
    .task-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { background: rgba(255,255,255,.045); padding: 3px 6px; color: var(--text-4); font-size: 7px; }
    .tag.agent { background: var(--mint-soft); color: var(--mint); }
    .task-progress, .meter { overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.06); }
    .task-progress { display: block; height: 2px; margin-top: 10px; }
    .task-progress i, .meter i { display: block; height: 100%; border-radius: inherit; background: var(--mint); }
    .task-foot { margin-top: 10px; }
    .assignee { display: inline-flex; min-width: 0; align-items: center; gap: 6px; }
    .face { width: 23px; height: 23px; border-radius: 50%; background: var(--surface-4); color: var(--text-2); font-size: 8px; font-style: normal; }
    .face.agent { border: 1px solid rgba(84,230,187,.22); background: var(--mint-soft); color: var(--mint); }
    .face.agent:after {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 5px;
      height: 5px;
      border: 2px solid var(--surface-1);
      border-radius: 50%;
      background: var(--mint);
      content: "";
    }
    .assignee > span { overflow: hidden; color: var(--text-4); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .due { color: var(--text-4); font: 8px "SFMono-Regular", monospace; white-space: nowrap; }
    .due.late { color: var(--red); }

    .list-wrap { overflow: auto; border-top: 1px solid var(--line); }
    .task-table { width: 100%; min-width: 850px; border-collapse: collapse; }
    .task-table th {
      height: 38px;
      border-bottom: 1px solid var(--line);
      color: var(--text-4);
      font-size: 9px;
      font-weight: 600;
      text-align: left;
    }
    .task-table td { height: 51px; border-bottom: 1px solid var(--line); color: var(--text-3); font-size: 10px; }
    .task-table tr[data-task] { cursor: pointer; transition: background .14s; }
    .task-table tr[data-task]:hover { background: rgba(255,255,255,.025); }
    .list-title { display: flex; align-items: center; gap: 10px; }
    .list-title strong { color: var(--text-1); font-size: 10px; font-weight: 600; }
    .status { padding: 3px 7px; background: rgba(255,255,255,.05); color: var(--text-3); font-size: 8px; }
    .status.in_progress { background: var(--mint-soft); color: var(--mint); }
    .status.review { background: var(--amber-soft); color: var(--amber); }
    .status.done { color: #76837f; }
    .status.blocked { background: var(--red-soft); color: var(--red); }

    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .calendar-head h2 { margin: 0; color: var(--text-1); font-size: 13px; }
    .calendar-head p { margin: 4px 0 0; color: var(--text-4); font-size: 9px; }
    .calendar-wrap { overflow-x: auto; }
    .calendar { display: grid; min-width: 980px; grid-template-columns: repeat(7,minmax(140px,1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }

        '<div class="module-workspace"><div class="module-layout"><div><section class="module-section"><div class="module-section-head"><h2>与你的项目匹配</h2><span>6 个协作能力</span></div><button class="market-row" data-demo="邀请体验研究数字员工"><span class="row-symbol">' + icon('self') + '</span><span class="row-copy"><strong>林澜的体验研究数字员工</strong><span>擅长可用性测试、访谈编码与体验指标</span></span><span class="row-meta">92% 匹配<br>可协作</span></button><button class="market-row" data-demo="邀请搜索策略数字员工"><span class="row-symbol">' + icon('workspace') + '</span><span class="row-copy"><strong>搜索策略数字员工</strong><span>拥有搜索召回、意图识别与空结果优化经验</span></span><span class="row-meta">87% 匹配<br>需确认</span></button><button class="market-row" data-demo="邀请数据治理 Agent"><span class="row-symbol">' + icon('insights') + '</span><span class="row-copy"><strong>数据治理 Agent</strong><span>可协助统一指标口径并检查数据血缘</span></span><span class="row-meta">81% 匹配<br>在线</span></button></section><section class="module-section"><div class="module-section-head"><h2>组织信号</h2><span>最近 24 小时</span></div><div class="market-row"><span class="row-symbol">' + icon('market') + '</span><span class="row-copy"><strong>三个项目正在解决空结果推荐问题</strong><span>可复用 2 份策略简报与 1 套评估指标</span></span><span class="row-meta">12 分钟前</span></div><div class="market-row"><span class="row-symbol">' + icon('knowledge') + '</span><span class="row-copy"><strong>体验设计团队新增可用性测试模板</strong><span>已被 4 个项目采用</span></span><span class="row-meta">2 小时前</span></div></section></div><aside><section class="module-section"><div class="module-section-head"><h2>当前协作</h2><span>3 项</span></div><div class="health-list"><div class="health-row"><span>委托中</span><strong>1 项</strong></div><div class="health-row"><span>等待对方确认</span><strong class="risk">1 项</strong></div><div class="health-row"><span>已采纳</span><strong>1 项</strong></div></div></section><section class="approval-panel" style="margin-top:22px"><div class="eyebrow">Suggested action</div><h3>为 TASK-485 邀请数据治理 Agent</h3><p>它可以对比当前项目与组织指标字典，但任何写入仍需你确认。</p><button class="button primary" data-demo="已发送协作邀请">发送协作邀请</button></section></aside></div></div>';
    }

    function renderAdmin() {
      return pageHeader('Governance', '管理控制台', '管理用户、Agent、工具授权、权限策略与运行审计。', '<button class="button" data-demo="查看系统诊断">系统诊断</button>') +
        '<div class="module-workspace"><div class="module-layout"><div><section class="module-section"><div class="module-section-head"><h2>Agent 权限策略</h2><span>服务端权威</span></div><div class="knowledge-row"><span class="row-symbol">' + icon('bot') + '</span><span class="row-copy"><strong>Research Agent</strong><span>文档检索 · Web Research · Artifact 写入需审批</span></span><span class="row-meta">3 个 Grant</span></div><div class="knowledge-row"><span class="row-symbol">' + icon('bot') + '</span><span class="row-copy"><strong>Data Agent</strong><span>Metrics Connector · O2 只读 · 任何写入需审批</span></span><span class="row-meta">3 个 Grant</span></div><div class="knowledge-row"><span class="row-symbol">' + icon('admin') + '</span><span class="row-copy"><strong>Risk Agent</strong><span>Policy Engine · Audit Log · 处置结果需人审</span></span><span class="row-meta">2 个 Grant</span></div></section><section class="module-section"><div class="module-section-head"><h2>最近审计</h2><span>不可变记录</span></div><div class="knowledge-row"><span class="row-symbol">' + icon('clock') + '</span><span class="row-copy"><strong>Research Agent 暂停 TASK-482</strong><span>原因：证据来源不可读取 · policy.evidence_required</span></span><span class="row-meta">18 分钟前</span></div><div class="knowledge-row"><span class="row-symbol">' + icon('check') + '</span><span class="row-copy"><strong>Risk Agent 隔离外部资料</strong><span>TASK-488 · 检测到疑似提示词注入</span></span><span class="row-meta">昨天</span></div></section></div><aside><section class="module-section"><div class="module-section-head"><h2>系统状态</h2><span>单 Workspace</span></div><div class="health-list"><div class="health-row"><span>API</span><strong>正常</strong></div><div class="health-row"><span>SQLite</span><strong>正常</strong></div><div class="health-row"><span>Provider</span><strong>3 / 4 就绪</strong></div><div class="health-row"><span>待审批</span><strong class="risk">2 项</strong></div></div></section></aside></div></div>';
    }

    function renderDigitalHuman() {
      const agent = agents.find(function (item) { return item.id === 'personal'; });
      return pageHeader('Personal agent settings', '数字员工管理', '配置你的数字员工身份、能力、工具授权与渐进自治边界。', '<button class="button" data-module="tasks">' + icon('tasks') + '查看负责的任务</button>') +
        '<div class="module-workspace"><div class="module-layout"><div><section class="agent-hero"><div class="agent-identity"><i class="agent-icon online">PA</i><div><h2>何云深的数字员工</h2><p>' + esc(agent.description) + '</p><div class="agent-badges"><span class="agent-badge live">在线</span><span class="agent-badge">' + esc(agent.model) + '</span><span class="agent-badge">' + esc(agent.autonomy) + '</span></div></div></div><button class="button" data-demo="编辑数字员工资料">编辑资料</button></section><div class="agent-grid"><div><section class="agent-section"><h3>Skill 能力</h3><div class="capabilities">' + agent.skills.map(function (skill) { return '<button class="capability on" data-capability>' + esc(skill) + '</button>'; }).join('') + '</div></section><section class="agent-section"><h3>当前任务与委托</h3><button class="work-row" data-task="TASK-489"><span><strong>跟进商家运营补充约束条件</strong><span>TASK-489 · 等待外部</span></span><b>今天</b></button><button class="work-row" data-task="TASK-492"><span><strong>准备项目阶段复盘框架</strong><span>TASK-492 · 队列 #1</span></span><b>8/23</b></button></section></div><aside><section class="agent-section"><h3>工具授权</h3><div class="capabilities">' + agent.tools.map(function (tool) { return '<button class="capability on" data-capability>' + esc(tool) + '</button>'; }).join('') + '</div></section><section class="agent-section"><h3>自治策略</h3><div class="policy-row"><span>日常跟进</span><strong>自动执行</strong></div><div class="policy-row"><span>共享项目知识</span><strong>需要确认</strong></div><div class="policy-row"><span>外部写入</span><strong>需要确认</strong></div><div class="policy-row"><span>失败处理</span><strong>暂停并通知</strong></div></section></aside></div></div><aside><section class="module-section"><div class="module-section-head"><h2>近 7 日</h2><span>运行质量</span></div><div class="health-list"><div class="health-row"><span>完成任务</span><strong>11</strong></div><div class="health-row"><span>准时率</span><strong>94%</strong></div><div class="health-row"><span>人工介入</span><strong>3 次</strong></div></div></section></aside></div></div>';
    }

    function renderProductModule() {
      let content = '';
      if (state.module === 'digital-self') content = renderDigitalSelf();
      else if (state.module === 'workspace') content = renderWorkspace();
      else if (state.module === 'insights') content = renderInsights();
      else if (state.module === 'knowledge') content = renderKnowledge();
      else if (state.module === 'collaboration') content = renderCollaboration();
      else if (state.module === 'market') content = renderMarket();
      else if (state.module === 'admin') content = renderAdmin();
      else if (state.module === 'digital-human') content = renderDigitalHuman();
      else content = renderDigitalSelf();
      return '<div class="page">' + contextBar() + content + '</div>';
    }

    function renderApp() {
      renderGlobalNav();
      byId('mainRoot').innerHTML = state.module === 'tasks' ? renderTasksPage() : renderProductModule();
      document.body.classList.remove('nav-open');
    }

    function openTask(id) {
      const task = taskById(id);
      if (!task) return;
      state.selectedTask = id;
      renderDrawer();
      document.body.classList.add('drawer-open');
    }

    function relationButton(moduleId, iconName, title, subtitle, taskId) {
      return '<button class="relation-button" data-open-module="' + moduleId + '" data-context-task="' + taskId + '"><span class="row-symbol">' + icon(iconName) + '</span><span class="row-copy"><strong>' + esc(title) + '</strong><span>' + esc(subtitle) + '</span></span>' + icon('chevron') + '</button>';
    }

    function renderDrawer() {
      const task = taskById(state.selectedTask);
      if (!task) return;
      const person = assignee(task.assignee);
      const currentIndex = statusOrder.indexOf(task.status);
      const next = statusOrder[Math.min(currentIndex + 1, statusOrder.length - 1)];
      byId('drawerTaskKey').textContent = task.id;
      byId('drawerBody').innerHTML =
        '<div class="drawer-tags"><span class="priority ' + task.priority.toLowerCase() + '">' + task.priority + '</span><span class="status ' + (task.blocked ? 'blocked' : task.status) + '">' + (task.blocked ? '阻塞' : statusMeta[task.status].label) + '</span><span class="tag">' + esc(task.type) + '</span>' + (person.type === 'agent' ? '<span class="tag agent">Agent 执行</span>' : '') + '</div>' +
        '<h2>' + esc(task.title) + '</h2><p class="drawer-summary">' + esc(task.description) + '</p>' +
        '<section class="drawer-section"><div class="form-grid"><div class="field"><label for="editStatus">阶段</label><select id="editStatus">' + statusOrder.map(function (status) { return '<option value="' + status + '" ' + (status === task.status ? 'selected' : '') + '>' + statusMeta[status].label + '</option>'; }).join('') + '</select></div><div class="field"><label for="editAssignee">负责人</label><select id="editAssignee">' + Object.keys(people).map(function (id) { const item = people[id]; return '<option value="' + id + '" ' + (id === task.assignee ? 'selected' : '') + '>' + (item.type === 'agent' ? 'Agent · ' : '') + esc(item.name) + '</option>'; }).join('') + '</select></div><div class="field"><label for="editDue">截止日期</label><input id="editDue" type="date" value="' + task.due + '"></div><div class="field"><label for="editPriority">优先级</label><select id="editPriority">' + ['P0','P1','P2','P3'].map(function (priority) { return '<option ' + (priority === task.priority ? 'selected' : '') + '>' + priority + '</option>'; }).join('') + '</select></div></div></section>' +
        '<section class="drawer-section"><h3>任务进度</h3><div class="progress-line"><div class="meter"><i style="width:' + task.progress + '%"></i></div><strong>' + task.progress + '%</strong></div></section>' +
        '<section class="drawer-section"><h3><span>子任务</span><span>' + task.subtasks.filter(function (subtask) { return subtask[1]; }).length + ' / ' + task.subtasks.length + '</span></h3><div class="check-list">' + task.subtasks.map(function (subtask, index) { return '<label class="check-item"><input type="checkbox" data-subtask="' + index + '" ' + (subtask[1] ? 'checked' : '') + '><span>' + esc(subtask[0]) + '</span></label>'; }).join('') + '</div></section>' +
        '<section class="drawer-section"><h3><span>依赖关系</span><span>' + task.dependencies.length + '</span></h3>' + (task.dependencies.length ? task.dependencies.map(function (dependency) { return '<div class="dependency"><strong>' + esc(dependency[0]) + '</strong><span>' + esc(dependency[1]) + '</span></div>'; }).join('') : '<div class="empty">没有前置依赖</div>') + '</section>' +
        '<section class="drawer-section"><h3><span>关联工作</span><span>跨 AgentMesh 模块</span></h3>' +
          relationButton('workspace','workspace','AI 工作台运行','查看对话、执行节点与来源',task.id) +
          relationButton('knowledge','knowledge','知识与审批','查看候选、来源和血缘',task.id) +
          relationButton('collaboration','collaboration','协作讨论','查看团队与数字员工回复',task.id) +
          relationButton('insights','insights','项目洞察','查看该任务对进度的影响',task.id) +
        '</section>' +
        '<section class="drawer-section"><h3>活动与审计</h3><ol class="activity">' + task.activity.map(function (activity) { return '<li><strong>' + esc(activity[0]) + '</strong><span>' + esc(activity[1]) + '</span></li>'; }).join('') + '</ol></section>' +
        '<div class="drawer-actions"><button class="button" data-save-task>保存修改</button>' + (task.status !== 'done' ? '<button class="button primary" data-advance-task="' + next + '">推进到' + statusMeta[next].label + '</button>' : '<button class="button primary" data-open-module="workspace" data-context-task="' + task.id + '">查看交付物</button>') + '</div>';
    }

    function saveDrawer(advanceTo) {
      const task = taskById(state.selectedTask);
      if (!task) return;
      task.status = advanceTo || byId('editStatus').value;
      task.assignee = byId('editAssignee').value;
      task.due = byId('editDue').value;
      task.priority = byId('editPriority').value;
      task.subtasks = task.subtasks.map(function (subtask, index) {
        const checkbox = document.querySelector('[data-subtask="' + index + '"]');
        return [subtask[0], Boolean(checkbox && checkbox.checked)];
      });
      task.progress = task.status === 'done' ? 100 : Math.max(task.progress, Math.round(task.subtasks.filter(function (subtask) { return subtask[1]; }).length / Math.max(1, task.subtasks.length) * 100));
      task.activity.unshift([advanceTo ? '任务推进到' + statusMeta[task.status].label : '任务字段已更新','刚刚 · 何云深']);
      showToast(advanceTo ? '已将 ' + task.id + ' 推进到「' + statusMeta[task.status].label + '」' : '已保存 ' + task.id);
      renderDrawer();
      renderApp();
    }

    function openModule(moduleId, contextTaskId) {
      state.module = moduleId;
      state.contextTask = contextTaskId || null;
      document.body.classList.remove('drawer-open');
      renderApp();
    }
    function openCreateModal() {
      byId('createModal').classList.add('open');
      window.setTimeout(function () { byId('newTitle').focus(); }, 80);
    }
    function closeCreateModal() {
      byId('createModal').classList.remove('open');
      byId('createForm').reset();
      byId('newDue').value = '2026-08-21';
    }
    function showToast(message) {
      const toast = byId('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () { toast.classList.remove('show'); }, 2600);
    }

    document.addEventListener('click', function (event) {
      const openNav = event.target.closest('[data-open-nav]');
      if (openNav) { document.body.classList.add('nav-open'); return; }
      const closeNav = event.target.closest('[data-close-nav]');
      if (closeNav) { document.body.classList.remove('nav-open'); return; }

      const openRelated = event.target.closest('[data-open-module]');
      if (openRelated) {
        openModule(openRelated.dataset.openModule, openRelated.dataset.contextTask || null);
        return;
      }

      const moduleButton = event.target.closest('[data-module]');
      if (moduleButton) {
        openModule(moduleButton.dataset.module, null);
        return;
      }

      const backTask = event.target.closest('[data-back-task]');
      if (backTask) {
        const taskId = state.contextTask;
        state.module = 'tasks';
        state.contextTask = null;
        renderApp();
        window.setTimeout(function () { openTask(taskId); }, 60);
        return;
      }

      const taskButton = event.target.closest('[data-task]');
      if (taskButton) {
        const taskId = taskButton.dataset.task;
        if (state.module !== 'tasks') {
          state.module = 'tasks';
          state.contextTask = null;
          renderApp();
          window.setTimeout(function () { openTask(taskId); }, 60);
        } else {
          openTask(taskId);
        }
        return;
      }

      const viewButton = event.target.closest('[data-task-view]');
      if (viewButton) {
        state.view = viewButton.dataset.taskView;
        renderApp();
        return;
      }

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        state.filter = filterButton.dataset.filter;
        all('[data-filter]').forEach(function (button) { button.classList.toggle('active', button.dataset.filter === state.filter); });
        if (byId('viewRoot')) byId('viewRoot').innerHTML = renderTaskView();
        return;
      }

      const agentButton = event.target.closest('[data-agent]');
      if (agentButton) {
        state.selectedAgent = agentButton.dataset.agent;
        if (byId('viewRoot')) byId('viewRoot').innerHTML = renderAgents();
        return;
      }

      const toggleAgent = event.target.closest('[data-toggle-agent]');
      if (toggleAgent) {
        const agent = agents.find(function (item) { return item.id === toggleAgent.dataset.toggleAgent; });
        if (agent) {
          agent.status = agent.status === 'paused' ? 'online' : 'paused';
          agent.statusLabel = agent.status === 'paused' ? '已暂停' : '在线';
          showToast(agent.name + (agent.status === 'paused' ? ' 已暂停，不再接收新任务' : ' 已恢复运行'));
          if (byId('viewRoot')) byId('viewRoot').innerHTML = renderAgents();
        }
        return;
      }

      if (event.target.closest('[data-open-create]')) { openCreateModal(); return; }
      if (event.target.closest('[data-close-modal]') || event.target === byId('createModal')) { closeCreateModal(); return; }
      if (event.target.closest('[data-close-drawer]')) { document.body.classList.remove('drawer-open'); return; }
      if (event.target.closest('[data-save-task]')) { saveDrawer(); return; }

      const advanceButton = event.target.closest('[data-advance-task]');
      if (advanceButton) { saveDrawer(advanceButton.dataset.advanceTask); return; }

      const capability = event.target.closest('[data-capability]');
      if (capability) {
        capability.classList.toggle('on');
        showToast(capability.textContent.trim() + (capability.classList.contains('on') ? ' 已启用' : ' 已停用'));
        return;
      }

      if (event.target.closest('[data-approve-knowledge]')) {
        const panel = byId('knowledgeApproval');
        if (panel) panel.innerHTML = '<div class="eyebrow">Knowledge updated</div><h3>已确认并写入项目知识</h3><p>任务、Agent 运行与 6 个原始来源的血缘关系已保留。</p><button class="button" data-back-task>返回任务详情</button>';
        showToast('候选内容已确认并沉淀到项目知识');
        return;
      }

      const demoButton = event.target.closest('[data-demo]');
      if (demoButton) { showToast('原型动作：' + demoButton.dataset.demo); }
    });

    document.addEventListener('input', function (event) {
      if (event.target.id === 'taskSearch') {
        state.query = event.target.value;
        if (byId('viewRoot')) byId('viewRoot').innerHTML = renderTaskView();
      }
    });

    document.addEventListener('submit', function (event) {
      if (event.target.matches('[data-composer]')) {
        event.preventDefault();
        const input = event.target.querySelector('input');
        if (input && input.value.trim()) {
          showToast('消息已发送，Agent 将在当前任务上下文中继续');
          input.value = '';
        }
      }
    });

    byId('createForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const number = 500 + tasks.length + 1;
      const task = {
        id: 'TASK-' + number,
        title: String(data.get('title')).trim(),
        type: String(data.get('type')),
        status: String(data.get('status')),
        priority: String(data.get('priority')),
        due: String(data.get('due')),
        assignee: String(data.get('assignee')),
        progress: 0,
        blocked: false,
        tags: [String(data.get('type')),String(data.get('estimate'))],
        description: String(data.get('description')).trim() || '尚未补充任务说明。',
        subtasks: [['明确完成条件',false]],
        dependencies: [],
        activity: [['任务已创建','刚刚 · 何云深']]
      };
      tasks.unshift(task);
      closeCreateModal();
      state.module = 'tasks';
      state.view = 'board';
      state.filter = 'all';
      state.query = '';
      renderApp();
      showToast(task.id + ' 已创建并指派给 ' + assignee(task.assignee).name);
      window.setTimeout(function () { openTask(task.id); }, 160);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (byId('createModal').classList.contains('open')) closeCreateModal();
        else if (document.body.classList.contains('drawer-open')) document.body.classList.remove('drawer-open');
        else document.body.classList.remove('nav-open');
      }
      if (event.key === '/' && ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement && document.activeElement.tagName) < 0 && state.module === 'tasks' && ['board','list','calendar'].indexOf(state.view) >= 0) {
        event.preventDefault();
        const input = byId('taskSearch');
        if (input) input.focus();
      }
    });

    mountStaticIcons();
    renderApp();
  </script>
</body>
</html>
